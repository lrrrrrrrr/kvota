name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main gets a full build; superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS — tests, snapshots, app builds
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test KvotaKit (core + UI snapshots)
        working-directory: KvotaKit
        env:
          KVOTA_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build direct-download app
        run: |
          set -o pipefail
          xcodebuild -project Kvota.xcodeproj -scheme Kvota -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build > "$RUNNER_TEMP/build-direct.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/build-direct.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/build-direct.log"

      - name: Build App Store app
        run: |
          set -o pipefail
          xcodebuild -project Kvota.xcodeproj -scheme KvotaAppStore -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build > "$RUNNER_TEMP/build-appstore.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/build-appstore.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/build-appstore.log"

      - name: Check bundles
        run: |
          for app in build/Build/Products/Release/Kvota.app build/Build/Products/Release/KvotaAppStore.app; do
            echo "== $app"
            /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist"
            du -sh "$app"
            codesign -d --entitlements - "$app" 2>/dev/null | grep -E 'app-sandbox|user-selected' || echo "(no sandbox entitlements)"
          done
          # Kvota reads local files only: neither build may contain provider endpoints.
          for binary in build/Build/Products/Release/Kvota.app/Contents/MacOS/Kvota \
                        build/Build/Products/Release/KvotaAppStore.app/Contents/MacOS/KvotaAppStore; do
            if strings "$binary" | grep -E -q 'backend-api/wham|cloudcode-pa.googleapis|api/oauth/usage'; then
              echo "$binary unexpectedly contains provider endpoints"; exit 1
            fi
          done

      - name: Annotate errors
        if: failure()
        run: scripts/ci-annotate.sh "$RUNNER_TEMP"/*.log

      - name: Package app
        run: |
          # A zip keeps the executable bit and code signature intact; --norsrc avoids
          # AppleDouble files that would break the signature when unzipped elsewhere.
          ditto -c -k --norsrc --keepParent build/Build/Products/Release/Kvota.app "$RUNNER_TEMP/Kvota.zip"
          ls -la "$RUNNER_TEMP/Kvota.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Kvota-app
          path: ${{ runner.temp }}/Kvota.zip
          compression-level: 0

  linux:
    name: Linux — core tests
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test KvotaCore
        run: swift test --package-path KvotaKit
